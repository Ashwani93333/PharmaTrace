# ===============================
# Application Details
# ===============================
spring.application.name=traceability-system

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Ashwani@93333

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=meditrace-audit-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# Custom App Properties (JWT & URLs)
# ===============================
app.jwt.secret=ThisIsMySuperSecureSecretKeyForHS512AlgorithmWhichIsAtLeast64CharactersLong!!!
# Expiration: 24 Hours (in milliseconds)
app.jwt.expiration-ms=86400000

# Used for embedding the verification link inside the generated QR Code
app.base-url=https://api.meditrace.com

jwt.secret=ThisIsMySuperSecureSecretKeyForHS512AlgorithmWhichIsAtLeast64CharactersLong!!!
jwt.expiration=86400000
jwt.refresh-expiration=604800000